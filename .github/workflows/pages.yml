name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    # "Deploy production API" passes its Terraform outputs here so a freshly
    # applied stack publishes with its own values. It cannot write repository
    # variables: GITHUB_TOKEN has no access to the Actions variables API, and a
    # long-lived admin PAT is not worth storing for this. A manual run passes
    # nothing and falls back to the repository variables.
    inputs:
      api_base_url:
        description: API Gateway base URL, without a trailing slash
        required: false
      cognito_user_pool_id:
        required: false
      cognito_user_pool_client_id:
        required: false
      cognito_domain:
        required: false
      aws_region:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
      # Never hard-code a pool here. A push to frontend/** runs this workflow with
      # no inputs, so a literal fallback would publish the public site wired to
      # whichever account that literal names, and visitors would hand their
      # credentials to it. The repository variables hold the deployed stack.
      VITE_AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION }}
      VITE_COGNITO_USER_POOL_ID: ${{ inputs.cognito_user_pool_id || vars.VITE_COGNITO_USER_POOL_ID }}
      VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ inputs.cognito_user_pool_client_id || vars.VITE_COGNITO_USER_POOL_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ inputs.cognito_domain || vars.VITE_COGNITO_DOMAIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build landing page
        working-directory: frontend
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
