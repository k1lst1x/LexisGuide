name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ../packages/review_contract -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest

  review-contract:
    name: Review contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/review_contract/pyproject.toml
      - name: Install dependencies
        run: pip install -e 'packages/review_contract' 'pytest>=8.3,<10.0' 'ruff>=0.14,<0.17'
      - name: Lint and check formatting
        run: |
          ruff check packages/review_contract
          ruff format --check packages/review_contract
      - name: Test
        run: pytest packages/review_contract/tests

  agentcore-runtime:
    name: AgentCore runtime checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentcore/runtime
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            agentcore/runtime/pyproject.toml
            packages/review_contract/pyproject.toml
      - name: Install the runtime and shared contract
        run: pip install -e ../../packages/review_contract -e .
      - name: Test AgentCore request and result integration
        run: python -m unittest discover -s tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.6.6'
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without state backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
