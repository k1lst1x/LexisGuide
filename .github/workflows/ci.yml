name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ../packages/review_contract -e ../packages/assistant_agent -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest

  review-contract:
    name: Review contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/review_contract/pyproject.toml
      - name: Install dependencies
        run: pip install -e 'packages/review_contract' 'pytest>=8.3,<10.0' 'ruff>=0.14,<0.17'
      - name: Lint and check formatting
        run: |
          ruff check packages/review_contract
          ruff format --check packages/review_contract
      - name: Test
        run: pytest packages/review_contract/tests

  assistant-agent:
    name: Assistant agent checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/assistant_agent/pyproject.toml
      - name: Install the agent package
        run: pip install -e 'packages/assistant_agent' 'pytest>=8.3,<10.0' 'ruff>=0.14,<0.17'
      - name: Lint and check formatting
        run: |
          ruff check packages/assistant_agent
          ruff format --check packages/assistant_agent
      - name: Test the agent
        run: pytest packages/assistant_agent/tests
      - name: Test the AgentCore entrypoint
        working-directory: agentcore/assistant
        env:
          AWS_REGION: us-east-1
        run: |
          pip install 'bedrock-agentcore>=1.0,<2.0'
          python -m unittest discover -s tests

  agentcore-runtime:
    name: AgentCore runtime checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentcore/runtime
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            agentcore/runtime/pyproject.toml
            packages/review_contract/pyproject.toml
      - name: Install the runtime and shared contract
        run: pip install -e ../../packages/review_contract -e .
      - name: Test AgentCore request and result integration
        run: python -m unittest discover -s tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.6.6'
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without state backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
