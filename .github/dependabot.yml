version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint 8 supports TypeScript below 6.1. Keep Dependabot from
    # creating un-installable frontend update PRs until that compatibility lands.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
