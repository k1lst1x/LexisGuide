[project]
name = "lexisguide-legal-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.42,<2.0",
  "bedrock-agentcore>=1.0,<2.0",
  "aws-opentelemetry-distro~=0.18.0",
  "lexisguide-review-contract",
]

[tool.uv.sources]
lexisguide-review-contract = { path = "../../packages/review_contract", editable = true }

[tool.agentcore]
entrypoint = "main.py"
runtime = "PYTHON_3_13"
network_mode = "PUBLIC"
memory = "none"
