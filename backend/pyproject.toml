[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexisguide-api"
version = "0.1.0"
description = "API for LexisGuide"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.42,<2.0",
  "fastapi>=0.141,<0.142",
  "PyJWT[crypto]>=2.10,<3.0",
  "uvicorn[standard]>=0.38,<0.54",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<10.0",
  "ruff>=0.14,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
