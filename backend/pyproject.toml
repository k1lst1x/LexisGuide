[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexisguide-api"
version = "0.1.0"
description = "API for LexisGuide"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "awscrt>=0.29,<1.0",
  "boto3>=1.42,<2.0",
  "fastapi>=0.141,<0.142",
  "lexisguide-assistant",
  "lexisguide-review-contract",
  "mangum>=0.19,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "uvicorn[standard]>=0.38,<0.54",
  "web3>=7.6,<8",
]

[project.optional-dependencies]
dev = [
  # An in-memory EVM, so the ledger tests run the real contract bytecode.
  "eth-tester[py-evm]>=0.12,<0.14",
  # An in-memory DynamoDB, so storage tests run real conditions and transactions.
  "moto[dynamodb]>=5.1,<6",
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<10.0",
  "ruff>=0.14,<0.17",
]

# The shared contracts live in this repo, not on an index. The Lambda build
# installs them from the same paths; here uv resolves them for local runs and tests.
[tool.uv.sources]
lexisguide-assistant = { path = "../packages/assistant_agent", editable = true }
lexisguide-review-contract = { path = "../packages/review_contract", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
