[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexisguide-review-contract"
version = "0.1.0"
description = "Shared request, response, and prompting contract for LexisGuide review services"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.9,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/review_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
